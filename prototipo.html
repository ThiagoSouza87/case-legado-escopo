<title>Intranet Corporativa · Protótipo</title>

<style>
/* Protótipo de portfólio. Tema claro único e deliberado:
   o sistema de referência do cliente era claro, e o protótipo
   precisava parecer parte do mesmo produto. Todas as cores são
   pintadas explicitamente. */
:root{
  --navy:      #101C33;
  --navy-2:    #1B2A45;
  --navy-3:    #27374F;

  --page:      #F7F9FC;
  --surface:   #FFFFFF;
  --surface-2: #F8FAFC;
  --surface-3: #EEF2F7;

  --ink:       #1E293B;
  --ink-2:     #374151;
  --muted:     #6B7280;
  --faint:     #94A3B8;
  --line:      #E5EAF1;
  --line-2:    #D3DCE7;

  --blue:      #1668E0;
  --blue-2:    #1257C0;
  --blue-3:    #DBEAFE;
  --title:     #1A4C8B;

  --green:     #15A04A;  --green-bg:#DCFCE7;
  --red:       #DC2626;  --red-bg:  #FEE2E2;
  --amber:     #D97706;  --amber-bg:#FEF3C7;
  --purple:    #7C3AED;  --purple-bg:#EDE9FE;
  --orange:    #EA7C1B;  --orange-bg:#FFEDD5;

  --warnband:  #FEF9E7;  --warnband-ink:#854D0E;

  --sans: system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono: ui-monospace,"Cascadia Mono","Segoe UI Mono",Consolas,monospace;

  --sh:   0 1px 2px rgba(16,28,51,.05);
  --sh-2: 0 1px 3px rgba(16,28,51,.08), 0 8px 24px -12px rgba(16,28,51,.18);
  --sh-3: 0 4px 12px rgba(16,28,51,.12), 0 24px 56px -20px rgba(16,28,51,.34);
  --r:8px; --r-lg:12px;
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--page); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0; font-weight:700; letter-spacing:-.01em; text-wrap:balance}
p{margin:0}
button{font:inherit; color:inherit; background:none; border:none; cursor:pointer}
input,select{font:inherit; color:inherit}
a{color:var(--blue)}
:focus-visible{outline:2px solid var(--blue); outline-offset:2px; border-radius:4px}
.num{font-variant-numeric:tabular-nums}

.skip{position:absolute;left:8px;top:-60px;z-index:200;background:var(--blue);color:#fff;padding:10px 16px;border-radius:var(--r);transition:top .15s}
.skip:focus{top:8px}

.demo{
  background:var(--navy-2); color:#C7D4E6; font-size:11.5px; padding:6px 20px;
  text-align:center; letter-spacing:.01em;
}
.demo b{color:#fff; font-weight:600}

/* ---------------- TOPBAR (navy) ---------------- */
.topbar{
  background:var(--navy); color:#fff; display:flex; align-items:center; gap:6px;
  padding:0 18px; height:62px; position:sticky; top:0; z-index:60;
}
.brand{display:grid; line-height:1; margin-right:14px; flex-shrink:0}
.brand-sys{font-size:8px; letter-spacing:.14em; color:#9FB4D4; font-weight:700}
.brand-name{font-size:19px; font-weight:800; letter-spacing:-.005em; color:#fff}
.brand-sub{font-size:7.5px; letter-spacing:.3em; color:#8AA2C6; font-weight:600}
.brand-div{width:1px; height:26px; background:#33436180; margin-right:12px; flex-shrink:0}
.brand-app{font-size:13px; color:#A8BCDA; margin-right:16px; flex-shrink:0; letter-spacing:.02em}

.tnav{display:flex; gap:2px; align-items:center; overflow-x:auto; scrollbar-width:none}
.tnav::-webkit-scrollbar{display:none}
.tnav button{
  display:flex; align-items:center; gap:7px; padding:8px 13px; border-radius:var(--r);
  color:#D3DEEE; font-size:14px; white-space:nowrap; position:relative;
}
.tnav button svg{width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.9}
.tnav button:hover{background:#ffffff14; color:#fff}
.tnav button[aria-current="page"]{background:var(--blue); color:#fff; font-weight:600}
.tn-badge{
  background:var(--orange); color:#fff; font-size:10.5px; font-weight:700; border-radius:20px;
  padding:0 6px; min-width:17px; text-align:center; line-height:17px;
}

.tacts{display:flex; align-items:center; gap:8px; margin-left:auto; flex-shrink:0}
.tbtn{
  display:flex; align-items:center; gap:7px; padding:8px 13px; border-radius:var(--r);
  font-size:13.5px; color:#D3DEEE; border:1px solid #FFFFFF1F; white-space:nowrap;
}
.tbtn:hover{background:#ffffff14; color:#fff}
.tbtn.solid{background:var(--green); border-color:var(--green); color:#fff; font-weight:600}
.tbtn.solid:hover{background:#128A40}
.tbtn svg{width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:1.9}
.sel{
  display:flex; align-items:center; gap:9px; padding:6px 12px; border-radius:var(--r);
  background:#FFFFFF12; border:1px solid #FFFFFF1F; text-align:left; white-space:nowrap;
}
.sel:hover{background:#ffffff1f}
.sel svg{width:16px; height:16px; stroke:#9FB4D4; fill:none; stroke-width:1.8; flex-shrink:0}
.sel b{display:block; font-size:12.5px; color:#fff; font-weight:600; line-height:1.2}
.sel span{display:block; font-size:10.5px; color:#8AA2C6}
.avatar{
  width:34px; height:34px; border-radius:50%; background:var(--blue-2); color:#fff;
  display:grid; place-items:center; font-size:12.5px; font-weight:700; flex-shrink:0;
}

.burger{display:none; width:36px; height:36px; border-radius:var(--r); place-items:center; color:#D3DEEE}
.burger svg{width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:2}

/* ---------------- CRUMB + BUSCA ---------------- */
.crumb{
  background:var(--surface); border-bottom:1px solid var(--line); padding:9px 24px;
  font-size:12.5px; color:var(--muted); display:flex; align-items:center; gap:8px;
}
.crumb a{color:var(--blue); text-decoration:none}
.crumb a:hover{text-decoration:underline}
.crumb svg{width:12px; height:12px; stroke:var(--faint); fill:none; stroke-width:2.2}

.searchwrap{background:var(--surface); border-bottom:1px solid var(--line); padding:14px 24px; position:relative}
.searchbar{position:relative; max-width:1560px; margin:0 auto}
.searchbar input{
  width:100%; height:44px; padding:0 16px 0 44px; border:1px solid var(--line-2);
  background:var(--surface); border-radius:14px; font-size:14.5px;
}
.searchbar input::placeholder{color:var(--faint)}
.searchbar input:focus{border-color:var(--blue); box-shadow:0 0 0 3px #1668E01F; outline:none}
.searchbar > svg{position:absolute; left:15px; top:13px; width:18px; height:18px; stroke:var(--faint); fill:none; stroke-width:2; pointer-events:none}
.kbd{position:absolute; right:14px; top:13px; font-family:var(--mono); font-size:10.5px; color:var(--faint); border:1px solid var(--line-2); border-radius:4px; padding:2px 6px; pointer-events:none}
.results{
  position:absolute; top:50px; left:0; right:0; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r-lg); box-shadow:var(--sh-3); z-index:70; max-height:400px; overflow-y:auto;
}
.results[hidden]{display:none}
.res-h{font-size:10.5px; text-transform:uppercase; letter-spacing:.11em; color:var(--faint); font-weight:700; padding:12px 16px 5px; border-top:1px solid var(--line)}
.res-h:first-child{border-top:none}
.res{display:flex; align-items:center; gap:11px; width:100%; padding:9px 16px; text-align:left}
.res:hover,.res:focus-visible{background:var(--surface-2)}
.res-t{font-size:14px; font-weight:600}
.res-s{font-size:12px; color:var(--muted)}
.res-m{margin-left:auto; font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums}
.res-empty{padding:20px 16px; color:var(--muted); font-size:13.5px}

.band{background:var(--warnband); color:var(--warnband-ink); text-align:center; padding:11px 24px; font-size:14px}
.band b{font-weight:700}

/* ---------------- CONTEÚDO ---------------- */
main{padding:22px 24px 64px; max-width:1560px; margin:0 auto}
.ptitle{display:flex; align-items:flex-start; gap:13px; margin-bottom:20px; flex-wrap:wrap}
.ptitle-ic{width:30px; height:30px; flex-shrink:0; display:grid; place-items:center; margin-top:3px}
.ptitle-ic svg{width:27px; height:27px; stroke:var(--blue); fill:none; stroke-width:1.9}
.ptitle h1{font-size:29px; color:var(--title); letter-spacing:-.02em}
.ptitle p{font-size:12.5px; color:var(--muted); margin-top:2px}
.ptitle-r{margin-left:auto}

.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--sh)}
.card-h{display:flex; align-items:center; gap:11px; padding:15px 18px; border-bottom:1px solid var(--line)}
.card-h h2{font-size:17px; color:var(--ink); font-weight:600}
.card-h svg{width:18px; height:18px; stroke:var(--blue); fill:none; stroke-width:2}
.card-b{padding:18px}

/* stat tiles */
.stats{display:grid; grid-template-columns:repeat(5,1fr); gap:14px; margin-bottom:20px}
.stat{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); padding:16px; text-align:center; box-shadow:var(--sh)}
.stat-ic{width:38px; height:38px; border-radius:10px; display:grid; place-items:center; margin:0 auto 11px}
.stat-ic svg{width:19px; height:19px; stroke-width:2; fill:none}
.stat-v{font-size:31px; font-weight:700; letter-spacing:-.03em; line-height:1; font-variant-numeric:tabular-nums; color:var(--ink)}
.stat-l{font-size:13px; color:var(--muted); margin-top:7px}
.i-amber{background:var(--amber-bg)}  .i-amber svg{stroke:var(--amber)}
.i-blue{background:var(--blue-3)}     .i-blue svg{stroke:var(--blue)}
.i-green{background:var(--green-bg)}  .i-green svg{stroke:var(--green)}
.i-red{background:var(--red-bg)}      .i-red svg{stroke:var(--red)}
.i-purple{background:var(--purple-bg)}.i-purple svg{stroke:var(--purple)}
.i-orange{background:var(--orange-bg)}.i-orange svg{stroke:var(--orange)}
.v-red{color:var(--red)} .v-blue{color:var(--blue)} .v-green{color:var(--green)}

.grid2{display:grid; grid-template-columns:1fr 380px; gap:18px; align-items:start}

/* mini stats internos */
.mini{display:grid; grid-template-columns:repeat(4,1fr); gap:12px}
.mini div{background:var(--surface-2); border:1px solid var(--line); border-radius:var(--r); padding:13px 14px}
.mini b{display:block; font-size:22px; font-weight:700; letter-spacing:-.02em; font-variant-numeric:tabular-nums}
.mini span{font-size:12.5px; color:var(--muted)}

/* chips */
.chips{display:flex; gap:7px; flex-wrap:wrap}
.chip{padding:5px 13px; border:1px solid var(--line-2); border-radius:20px; font-size:13px; color:var(--ink-2); background:var(--surface); white-space:nowrap}
.chip:hover{border-color:var(--blue); color:var(--blue)}
.chip[aria-pressed="true"]{background:var(--blue); border-color:var(--blue); color:#fff; font-weight:600}
.pill{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700; padding:2px 9px; border-radius:20px; white-space:nowrap}
.p-green{background:var(--green-bg); color:#0F7A38}
.p-red{background:var(--red-bg); color:var(--red)}
.p-amber{background:var(--amber-bg); color:#92620A}
.p-orange{background:var(--orange-bg); color:#B45309}
.p-gray{background:var(--surface-3); color:var(--muted)}
.tagx{font-size:10px; font-weight:700; letter-spacing:.06em; background:var(--surface-3); color:var(--muted); padding:2px 7px; border-radius:4px; text-transform:uppercase}

/* feed */
.feed-item{display:grid; grid-template-columns:36px 1fr auto; gap:13px; align-items:start; padding:14px 18px; border-bottom:1px solid var(--line); text-align:left; width:100%}
.feed-item:last-child{border-bottom:none}
.feed-item:hover{background:var(--surface-2)}
.feed-ic{width:36px; height:36px; border-radius:9px; display:grid; place-items:center; flex-shrink:0}
.feed-ic svg{width:17px; height:17px; fill:none; stroke-width:2}
.feed-t{font-size:14.5px; font-weight:600; line-height:1.35; color:var(--ink)}
.feed-m{font-size:12.5px; color:var(--muted); margin-top:3px; display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.feed-r{font-size:12px; color:var(--faint); white-space:nowrap; padding-top:2px; font-variant-numeric:tabular-nums}

/* fila / botão resolver */
.q{display:flex; align-items:center; gap:12px; padding:12px 18px; border-bottom:1px solid var(--line)}
.q:last-child{border-bottom:none}
.q-t{font-size:14px; font-weight:700; color:var(--title)}
.q-s{font-size:12.5px; color:var(--muted); margin-top:1px}
.btn-sm{background:var(--blue); color:#fff; padding:6px 15px; border-radius:6px; font-size:13px; font-weight:600; margin-left:auto; flex-shrink:0}
.btn-sm:hover{background:var(--blue-2)}

/* pessoas */
.plist{display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:12px; list-style:none; padding:0; margin:0}
.pcard{display:flex; align-items:center; gap:12px; width:100%; text-align:left; padding:13px 15px; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); box-shadow:var(--sh)}
.pcard:hover{border-color:var(--blue); box-shadow:var(--sh-2)}
.av{width:40px; height:40px; border-radius:50%; display:grid; place-items:center; flex-shrink:0; background:var(--blue-3); color:var(--blue-2); font-weight:700; font-size:14px}
.av.lg{width:62px; height:62px; font-size:21px}
.pcard-n{font-size:14.5px; font-weight:600; line-height:1.25}
.pcard-d{font-size:12.5px; color:var(--muted)}
.pcard-r{margin-left:auto; text-align:right; flex-shrink:0}
.pcard-r b{font-size:17px; font-weight:700; color:var(--title); font-variant-numeric:tabular-nums; letter-spacing:-.02em}
.pcard-r span{display:block; font-size:9.5px; text-transform:uppercase; letter-spacing:.1em; color:var(--faint); font-weight:600}

/* linhas */
.rows{list-style:none; padding:0; margin:0}
.row{display:grid; grid-template-columns:66px 1fr 148px 108px; gap:14px; align-items:center; width:100%; text-align:left; padding:13px 18px; border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row:hover{background:var(--surface-2)}
.row-c{font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums; font-weight:600}
.row-n{font-size:14.5px; font-weight:600; line-height:1.3}
.row-s{font-size:12.5px; color:var(--muted); margin-top:2px}

.toolbar{display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:16px}
.filter{position:relative; flex:1; min-width:240px; max-width:420px}
.filter input{width:100%; height:40px; padding:0 12px 0 38px; border:1px solid var(--line-2); background:var(--surface); border-radius:var(--r); font-size:14px}
.filter input:focus{border-color:var(--blue); box-shadow:0 0 0 3px #1668E01F; outline:none}
.filter svg{position:absolute; left:12px; top:11px; width:17px; height:17px; stroke:var(--faint); fill:none; stroke-width:2}
.count{font-size:13px; color:var(--muted); margin-left:auto; font-variant-numeric:tabular-nums}
.empty{padding:52px 20px; text-align:center; color:var(--muted)}
.empty b{display:block; font-size:17px; color:var(--ink); margin-bottom:5px}

/* seções tipo Central de Importações */
.grp{margin-bottom:26px}
.grp-h{display:flex; align-items:baseline; gap:9px; padding-bottom:8px; border-bottom:1px solid var(--line); margin-bottom:14px; flex-wrap:wrap}
.grp-h svg{width:16px; height:16px; stroke-width:2; fill:none; align-self:center}
.grp-h b{font-size:15.5px; font-weight:700}
.grp-h span{font-size:12.5px; color:var(--muted)}
.catgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:14px}
.cat{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); padding:15px; box-shadow:var(--sh); display:flex; flex-direction:column}
.cat:hover{box-shadow:var(--sh-2)}
.cat-h{display:flex; gap:11px; align-items:flex-start; margin-bottom:10px}
.cat-ic{width:32px; height:32px; border-radius:8px; display:grid; place-items:center; flex-shrink:0}
.cat-ic svg{width:16px; height:16px; stroke-width:2; fill:none}
.cat-n{font-size:14.5px; font-weight:700; line-height:1.25}
.cat-d{font-size:12.5px; color:var(--muted); line-height:1.4; margin-top:2px}
.cat-tags{display:flex; gap:5px; margin-bottom:12px; flex-wrap:wrap}
.cat-btn{display:block; width:100%; text-align:center; color:#fff; padding:9px; border-radius:6px; font-size:13.5px; font-weight:600; margin-top:auto}
.b-blue{background:var(--blue)}    .b-blue:hover{background:var(--blue-2)}
.b-green{background:var(--green)}  .b-green:hover{background:#128A40}
.b-purple{background:var(--purple)}.b-purple:hover{background:#6A2BD9}
.b-orange{background:var(--orange)}.b-orange:hover{background:#D06A0F}
.b-amber{background:#E3A008}       .b-amber:hover{background:#C68A06}
.b-red{background:var(--red)}      .b-red:hover{background:#B91C1C}

/* tarefas / links */
.task{display:flex; gap:11px; align-items:flex-start; padding:11px 0; border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:none; padding-bottom:0}
.task-box{width:18px; height:18px; border:1.5px solid var(--line-2); border-radius:5px; margin-top:1px; flex-shrink:0; display:grid; place-items:center; background:var(--surface)}
.task-box svg{width:11px; height:11px; stroke:#fff; fill:none; stroke-width:3; opacity:0}
.task[data-done="1"] .task-box{background:var(--green); border-color:var(--green)}
.task[data-done="1"] .task-box svg{opacity:1}
.task[data-done="1"] .task-t{text-decoration:line-through; color:var(--faint)}
.task-t{font-size:13.5px; line-height:1.35; text-align:left; font-weight:500}
.task-d{font-size:11.5px; color:var(--muted); margin-top:2px}
.links{list-style:none; padding:0; margin:0}
.link{display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:var(--r); font-size:13.5px; width:100%; text-align:left; color:var(--ink-2)}
.link:hover{background:var(--surface-2); color:var(--blue)}
.link svg{width:15px; height:15px; stroke:var(--muted); fill:none; stroke-width:2}
.link .ext{margin-left:auto; opacity:.45}

/* drawer */
.scrim{position:fixed; inset:0; background:rgba(16,28,51,.45); z-index:80; opacity:0; transition:opacity .18s}
.scrim[hidden]{display:none}
.scrim.show{opacity:1}
.drawer{position:fixed; top:0; right:0; bottom:0; width:min(470px,100%); background:var(--surface); z-index:81; overflow-y:auto; transform:translateX(100%); transition:transform .22s cubic-bezier(.4,0,.2,1); box-shadow:var(--sh-3)}
.drawer[hidden]{display:none}
.drawer.show{transform:translateX(0)}
.drawer-h{display:flex; align-items:center; gap:12px; padding:14px 20px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--surface); z-index:2}
.drawer-h h2{font-size:16px; font-weight:600}
.iconbtn{width:34px; height:34px; border-radius:var(--r); display:grid; place-items:center; color:var(--muted)}
.iconbtn:hover{background:var(--surface-3); color:var(--ink)}
.iconbtn svg{width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:2}
.drawer-b{padding:22px}
.dl{display:grid; grid-template-columns:120px 1fr; gap:10px 14px; font-size:14px; margin:0}
.dl dt{color:var(--muted); font-size:13px}
.dl dd{margin:0}
.sec{margin-top:26px}
.sec-h{font-size:10.5px; text-transform:uppercase; letter-spacing:.12em; color:var(--faint); font-weight:700; padding-bottom:8px; border-bottom:1px solid var(--line); margin-bottom:12px}
.resp{display:flex; align-items:center; gap:11px; padding:8px 0}
.resp-a{font-size:12px; color:var(--muted); width:90px; flex-shrink:0}
.resp-n{font-size:14px; font-weight:600}
.resp-r{margin-left:auto; font-size:13.5px; color:var(--title); font-weight:700; font-variant-numeric:tabular-nums}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:7px; height:40px; padding:0 17px; background:var(--blue); color:#fff; border-radius:var(--r); font-size:14px; font-weight:600}
.btn:hover{background:var(--blue-2)}
.btn.ghost{background:var(--surface); color:var(--ink-2); border:1px solid var(--line-2)}
.btn.ghost:hover{background:var(--surface-2); color:var(--blue); border-color:var(--blue)}
.btn svg{width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:2}
.btn-row{display:flex; gap:9px; margin-top:22px; flex-wrap:wrap}

.note{display:flex; gap:11px; padding:14px 16px; background:var(--blue-3); border-radius:var(--r-lg); font-size:13.5px; color:#17427D; line-height:1.5; margin-bottom:22px}
.note svg{width:18px; height:18px; stroke:var(--blue-2); fill:none; stroke-width:2; flex-shrink:0; margin-top:1px}

/* ---- drawer ---- */
let lastFocus = null;
function openDrawer(html){
  lastFocus = document.activeElement;
  const d = document.getElementById("drawer"), s = document.getElementById("scrim");
  d.innerHTML = html; d.hidden = false; s.hidden = false;
  requestAnimationFrame(()=>{ d.classList.add("show"); s.classList.add("show"); });
  d.querySelector("button")?.focus();
}
function closeDrawer(){
  const d = document.getElementById("drawer"), s = document.getElementById("scrim");
  if (d.hidden) return;
  d.classList.remove("show"); s.classList.remove("show");
  setTimeout(()=>{ d.hidden = true; s.hidden = true; }, 200);
  lastFocus?.focus();
}
const dHead = t => `<div class="drawer-h"><button class="iconbtn" onclick="closeDrawer()" aria-label="Fechar">${svg('x')}</button><h2>${esc(t)}</h2></div>`;

/* ---- busca global ---- */
const q = document.getElementById("q"), results = document.getElementById("results");
function doSearch(){
  const v = q.value.trim().toLowerCase();
  if (v.length < 2){ results.hidden = true; q.setAttribute("aria-expanded","false"); return; }
  const dig = v.replace(/\D/g,"");
  const ps = PESSOAS.filter(p=>p.nome.toLowerCase().includes(v)||p.ramal.toLowerCase().includes(v)).slice(0,4);
  const es = EMPRESAS.filter(e=>e.nome.toLowerCase().includes(v)||e.apelido.toLowerCase().includes(v)
              ||String(e.cod).includes(dig)||(dig&&e.cnpj.replace(/\D/g,"").includes(dig))).slice(0,4);
  const cs = COMUNICADOS.filter(c=>c.titulo.toLowerCase().includes(v)).slice(0,3);
  let h = "";
  if (ps.length) h += `<p class="res-h">Pessoas</p>` + ps.map(p=>`
    <button class="res" role="option" onclick="pick('pessoa',${p.id})">
      <span class="av" style="width:30px;height:30px;font-size:11px" aria-hidden="true">${ini(p.nome)}</span>
      <span><span class="res-t">${esc(p.nome)}</span><span class="res-s">${p.dep}</span></span>
      <span class="res-m">${p.ramal}</span></button>`).join("");
  if (es.length) h += `<p class="res-h">Empresas</p>` + es.map(e=>`
    <button class="res" role="option" onclick="pick('empresa',${e.cod})">
      <span class="feed-ic i-blue" style="width:30px;height:30px">${svg('build')}</span>
      <span><span class="res-t">${esc(e.apelido)}</span><span class="res-s">${esc(e.nome)}</span></span>
      <span class="res-m">${e.cod}</span></button>`).join("");
  if (cs.length) h += `<p class="res-h">Comunicados</p>` + cs.map(c=>`
    <button class="res" role="option" onclick="pick('com','${esc(c.titulo)}|${c.tipo}|${c.setor}|${c.data}')">
      <span class="feed-ic ${TIPOS[c.tipo].ic}" style="width:30px;height:30px">${svg(TIPOS[c.tipo].sv)}</span>
      <span><span class="res-t">${esc(c.titulo)}</span><span class="res-s">${TIPOS[c.tipo].t}</span></span>
      <span class="res-m">${c.data}</span></button>`).join("");
  results.innerHTML = h || `<p class="res-empty">Nada encontrado para “${esc(q.value)}”.</p>`;
  results.hidden = false; q.setAttribute("aria-expanded","true");
}
function pick(kind,val){
  results.hidden = true; q.value = ""; q.setAttribute("aria-expanded","false");
  if (kind==="pessoa"){ go("ramais"); openPessoa(val); }
  if (kind==="empresa"){ go("empresas"); openEmpresa(val); }
  if (kind==="com"){ const [t,tp,s,d] = val.split("|"); go("comunicados"); openComunicado(t,tp,s,d); }
}
q.addEventListener("input", doSearch);
q.addEventListener("focus", doSearch);
document.addEventListener("click", e => {
  if (!e.target.closest(".searchbar")){ results.hidden = true; q.setAttribute("aria-expanded","false"); }
});
document.addEventListener("keydown", e => {
  if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="k"){ e.preventDefault(); q.focus(); q.select(); }
  if (e.key === "Escape"){ closeDrawer(); results.hidden = true; }
});

go("painel");
